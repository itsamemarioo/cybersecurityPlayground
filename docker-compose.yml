services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: petReg
      MARIADB_USER: user
      MARIADB_PASSWORD: pass
    volumes:
      - db_data:/var/lib/mysqli
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  db_data: